name: Independent company case render
on:
  push:
    branches: [main]
    paths:
      - 'companies/**/instances/**/inputs/**'
      - 'companies/**/instances/**/continuation.json'
      - '.github/workflows/company-case-render.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt playwright jsonschema==4.26.0 pypdf==6.21.4
      - run: python -m playwright install --with-deps chromium
      - name: Execute or resume contracted company cases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,pathlib,shutil,subprocess,sys,hashlib
          sys.path.insert(0,'scripts')
          import case_runtime as rt
          root=pathlib.Path.cwd()
          for source in sorted(root.glob('companies/*/instances/*/inputs/intake.json')):
              dossier=source.parent.parent
              if (dossier/'publication.json').exists(): continue
              binding=json.loads((dossier/'binding.json').read_text());cid=binding['case_id'];case=root/'data/cases'/cid
              continuation=dossier/'continuation.json'
              if continuation.exists():
                  c=json.loads(continuation.read_text())
                  subprocess.run(['gh','run','download',str(c['run_id']),'--name',c['artifact_name'],'--dir',str(root/'data/cases')],check=True)
                  if c['action']=='review':
                      ready=json.loads((dossier/'review-ready.json').read_text())
                      assert hashlib.sha256((case/ready['pdf_ref']).read_bytes()).hexdigest()==ready['pdf_sha256']
                      packet=rt.load(case/'state.json')['stages']['A4'];dest=case/packet['directory']
                      for f in (dossier/'reviews').iterdir():shutil.copy(f,dest/f.name)
                      result=json.loads((dossier/'review-result.json').read_text())
                      result['render']=packet['render_receipt']
                      (dest/'result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
                      rt.complete(cid,'A4')
                      print(rt.inspect(cid));continue
                  rt.invalidate(cid,'A3',c['reason']);stages=['A3']
              else:
                  rt.init(cid,json.loads(source.read_text()));stages=['A0','A1','A2','A3']
              for stage in stages:
                  packet=rt.begin(cid,stage,'manual_agent');dest=case/pathlib.Path(packet['output_ref']).parent
                  for f in (source.parent/stage).iterdir():shutil.copy(f,dest/f.name)
                  rt.complete(cid,stage)
              rt.begin(cid,'A4','manual_agent');print(rt.render(cid))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: company-case-execution
          path: data/cases/
